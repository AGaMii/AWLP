<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="역도 트레이너">
<meta name="theme-color" content="#1D9E75">
<title>역도 트레이너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--g:#1D9E75;--gl:#E1F5EE;--gd:#0F6E56;--r:#E24B4A;--b:#378ADD;--o:#BA7517;--bg:#f5f5f5;--card:#fff;--tx:#1a1a1a;--tx2:#666;--tx3:#999;--bd:rgba(0,0,0,0.12);--bd2:rgba(0,0,0,0.2);--sf:#f0f0f0;--ra:12px;--rs:8px;}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1e1e1e;--tx:#f0f0f0;--tx2:#aaa;--tx3:#666;--bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.2);--sf:#2a2a2a;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.hdr{background:var(--g);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.hdr-title{font-size:17px;font-weight:600;}
.hdr-sub{font-size:11px;opacity:.85;margin-top:1px;}
.hdr-btn{background:rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;border:none;color:#fff;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:.5px solid var(--bd);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 2px 8px;cursor:pointer;border:none;background:none;color:var(--tx3);font-size:9.5px;gap:3px;}
.ni i{font-size:21px;}
.ni.active{color:var(--g);}
.scroll{flex:1;overflow-y:auto;padding:14px 14px calc(70px + env(safe-area-inset-bottom));}
.screen{display:none;}.screen.active{display:block;}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:14px;margin-bottom:12px;}
.ct{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ct i{font-size:16px;color:var(--g);}
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.dtitle{font-size:18px;font-weight:700;color:var(--tx);}
.dsub{font-size:12px;color:var(--tx2);margin-top:3px;}
.darr{display:flex;gap:8px;}
.abtn{width:34px;height:34px;border-radius:8px;border:.5px solid var(--bd2);background:var(--sf);font-size:18px;cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center;}
.exc{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:14px;margin-bottom:10px;}
.exc-acc{border-color:rgba(186,117,23,.3);background:rgba(186,117,23,.03);}
.exc-lad{border-color:rgba(186,117,23,.5);background:linear-gradient(135deg,rgba(186,117,23,.06),rgba(29,158,117,.06));}
.vol-item{display:flex;flex-direction:column;gap:2px;flex:1;min-width:80px;}
.vol-label{font-size:10px;color:var(--tx2);}
.vol-value{font-size:17px;font-weight:700;color:var(--tx);}
.vol-unit{font-size:10px;color:var(--tx2);font-weight:400;}
.vol-bar-track{height:6px;background:var(--sf);border-radius:3px;overflow:hidden;}
.vol-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.vol-status{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.exn{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.exd{font-size:11px;color:var(--b);margin-bottom:6px;font-style:italic;}
.exm{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.wchip{background:var(--gl);color:var(--gd);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;}
@media(prefers-color-scheme:dark){.wchip{background:#0F6E56;color:#9FE1CB;}}
.epct{font-size:11px;color:var(--tx2);}
.srow{display:flex;gap:6px;flex-wrap:wrap;}
.sbtn{width:40px;height:40px;border-radius:8px;border:.5px solid var(--bd2);background:var(--sf);font-size:12px;font-weight:600;cursor:pointer;color:var(--tx2);}
.sbtn.done{background:var(--g);border-color:var(--g);color:#fff;}
.sbtn.failed{background:var(--r);border-color:var(--r);color:#fff;}
.tipbtn{background:none;border:none;color:var(--b);cursor:pointer;font-size:16px;padding:0;display:inline-flex;align-items:center;}
.tsec{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:20px 16px;margin-top:10px;text-align:center;}
.rwrap{position:relative;width:100px;height:100px;margin:0 auto 12px;}
.rwrap svg{transform:rotate(-90deg);}
.rcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--tx);}
.tpre{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
.pbtn{padding:6px 12px;border:.5px solid var(--bd2);border-radius:6px;background:var(--sf);font-size:12px;cursor:pointer;color:var(--tx2);}
.tadj{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:14px;}
.adjb{width:36px;height:36px;border-radius:50%;border:.5px solid var(--bd2);background:var(--sf);font-size:20px;cursor:pointer;color:var(--tx);}
.tbts{display:flex;gap:10px;justify-content:center;}
.tbtn{padding:10px 18px;border-radius:var(--rs);font-size:14px;cursor:pointer;border:.5px solid var(--bd2);background:var(--sf);color:var(--tx);font-weight:500;}
.tbtn.p{background:var(--g);border-color:var(--g);color:#fff;}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.plbl{font-size:12px;color:var(--tx2);width:120px;flex-shrink:0;}
.pinp{flex:1;height:36px;border:.5px solid var(--bd2);border-radius:6px;padding:0 10px;font-size:14px;background:var(--sf);color:var(--tx);}
.punit{font-size:12px;color:var(--tx2);width:24px;}
.gbtn{width:100%;padding:12px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
.ghostb{width:100%;padding:10px;border-radius:var(--rs);border:.5px solid var(--bd2);background:var(--sf);color:var(--tx);font-size:13px;cursor:pointer;margin-top:8px;}
.wtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.wtab{padding:6px 12px;border-radius:6px;border:.5px solid var(--bd2);background:var(--sf);font-size:12px;cursor:pointer;white-space:nowrap;color:var(--tx2);flex-shrink:0;}
.wtab.active{background:var(--g);border-color:var(--g);color:#fff;}
.pnote{font-size:12px;color:var(--tx2);background:var(--sf);border-radius:6px;padding:8px 10px;margin-bottom:12px;line-height:1.5;}
.pdcard{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:14px;margin-bottom:10px;}
.pdtitle{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:10px;}
.pexr{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:.5px solid var(--bd);gap:8px;}
.pexr:last-child{border-bottom:none;}
.pexn{font-size:13px;color:var(--tx);}
.pexnote{font-size:10px;color:var(--b);margin-top:2px;}
.pexrv{text-align:right;font-size:11px;color:var(--tx2);line-height:1.6;flex-shrink:0;}
.pexrv b{font-size:13px;color:var(--g);font-weight:700;}
.frow{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.fbtn{padding:5px 10px;border-radius:6px;border:.5px solid var(--bd2);background:var(--sf);font-size:11px;cursor:pointer;white-space:nowrap;color:var(--tx2);flex-shrink:0;}
.fbtn.active{background:var(--g);border-color:var(--g);color:#fff;}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:.5px solid var(--bd);}
.hrow:last-child{border-bottom:none;}
.hex{font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px;}
.htag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(55,138,221,.12);color:var(--b);}
.htag.pr{background:rgba(186,117,23,.15);color:var(--o);}
.hdate{font-size:11px;color:var(--tx2);margin-top:2px;}
.hwt{font-size:16px;font-weight:700;color:var(--g);}
.delbtn{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;padding:4px 8px;}
.exdel{flex:none;background:rgba(226,75,74,.12);border:.5px solid rgba(226,75,74,.4);color:var(--r);cursor:pointer;font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;white-space:nowrap;}
.exdel:active{background:rgba(226,75,74,.25);}
.istep{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:.5px solid var(--bd);}
.istep:last-child{border-bottom:none;}
.inum{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.itxt{font-size:13px;color:var(--tx);line-height:1.5;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.ltog{display:flex;border:.5px solid var(--bd2);border-radius:8px;overflow:hidden;margin-bottom:4px;}
.lbtn{flex:1;padding:10px;border:none;background:var(--sf);color:var(--tx2);font-size:14px;cursor:pointer;font-weight:500;}
.lbtn.active{background:var(--g);color:#fff;}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cmon{font-size:16px;font-weight:700;color:var(--tx);}
.cnav{width:32px;height:32px;border-radius:8px;border:.5px solid var(--bd2);background:var(--sf);cursor:pointer;color:var(--tx2);font-size:16px;display:flex;align-items:center;justify-content:center;}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cdow{font-size:10px;color:var(--tx3);text-align:center;padding:4px 0;}
.cday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;color:var(--tx2);position:relative;}
.cday.today{font-weight:700;color:var(--g);}
.cday.sel{background:var(--g);color:#fff!important;font-weight:700;}
.cday.hlog::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--g);}
.cday.sel.hlog::after{background:#fff;}
.cday.wday{background:var(--gl);}
@media(prefers-color-scheme:dark){.cday.wday{background:#0b4a38;}}
.cday.emp{pointer-events:none;}
.cdet{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:14px;margin-top:10px;}
.cexr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:.5px solid var(--bd);}
.cexr:last-child{border-bottom:none;}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:1px;cursor:pointer;}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
.dbtn{aspect-ratio:1;border-radius:8px;border:.5px solid var(--bd2);background:var(--sf);font-size:12px;cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center;font-weight:500;}
.dbtn.sel{background:var(--g);border-color:var(--g);color:#fff;}
.dbtn.dis{opacity:.4;cursor:not-allowed;}
.dbox{background:rgba(55,138,221,.07);border:.5px solid rgba(55,138,221,.25);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.dbtitle{font-size:12px;font-weight:600;color:var(--b);margin-bottom:6px;}
.drow{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;flex-wrap:wrap;gap:4px;}
.drow span:first-child{color:var(--tx2);}
select.pinp{appearance:none;}
.tipsec{background:var(--card);border:.5px solid var(--bd);border-radius:var(--ra);padding:14px;margin-bottom:12px;}
.tipitem{padding:10px 0;border-bottom:.5px solid var(--bd);}
.tipitem:last-child{border-bottom:none;padding-bottom:2px;}
.tiptitle{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.tipdesc{font-size:12.5px;color:var(--tx2);line-height:1.65;}
.tipdesc b{color:var(--g);}
.tiphl{outline:2px solid var(--g);outline-offset:2px;border-radius:8px;}
.adjb-sm{width:28px!important;height:28px!important;font-size:15px!important;padding:0!important;flex-shrink:0;border:.5px solid var(--bd2)!important;background:var(--sf)!important;color:var(--tx)!important;}
.exm b{color:var(--tx);font-size:13px;}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-title" id="H_TITLE"><i class="ti ti-barbell"></i> 역도 트레이너</div>
    <div class="hdr-sub" id="H_SUB"></div>
  </div>
  <div style="display:flex;gap:6px;">
    <button class="hdr-btn" id="H_TODAY" onclick="goToday()" style="background:#fff;color:var(--g);font-weight:700;"></button>
    <button class="hdr-btn" id="H_PREV" onclick="cycleWeek(-1)">이전 주</button>
    <button class="hdr-btn" id="H_NEXT" onclick="cycleWeek(1)">다음 주</button>
  </div>
</div>

<div class="scroll">
  <!-- TODAY -->
  <div class="screen active" id="screen-today">
    <div class="dnav">
      <div><div class="dtitle" id="D_TITLE">Day 1</div><div class="dsub" id="D_SUB"></div></div>
      <div class="darr">
        <button class="abtn" onclick="changeDay(-1)">&#8249;</button>
        <button class="abtn" onclick="changeDay(1)">&#8250;</button>
      </div>
    </div>
    <div id="AUTOWEEK_BANNER" style="display:none;background:linear-gradient(135deg,rgba(55,138,221,.12),rgba(29,158,117,.10));border:.5px solid rgba(55,138,221,.4);border-radius:var(--ra);padding:12px 14px;margin-bottom:12px;"></div>
    <div class="card" id="VOL_BANNER" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;"></div>
    <div class="card" id="WARM_SECTION" style="padding:14px;">
      <div class="ct"><i class="ti ti-flame"></i> <span id="WARM_TITLE"></span></div>
      <div id="WARM_LIST"></div>
      <button class="ghostb" id="BTN_ADD_WARM" onclick="toggleExtraPicker('warm')"></button>
      <div id="PICKER_warm" style="display:none;margin-top:10px;">
        <div style="font-size:11px;color:var(--tx2);margin-bottom:6px;" id="LIB_TITLE_warm"></div>
        <div class="frow" id="CHIPS_warm" style="flex-wrap:wrap;overflow-x:visible;"></div>
        <div style="font-size:11px;color:var(--tx2);margin:10px 0 6px;" id="CUSTOM_TITLE_warm"></div>
        <div class="prow">
          <input class="pinp" id="CUSTOM_NAME_warm" type="text">
          <button class="gbtn" style="width:auto;margin-top:0;padding:0 16px;" id="BTN_CUSTOM_warm" onclick="addCustomExtra('warm')"></button>
        </div>
        <button class="ghostb" id="BTN_CLOSE_warm" onclick="toggleExtraPicker('warm')"></button>
      </div>
    </div>
    <div id="EX_LIST"></div>
    <div class="card" id="ACC_SECTION" style="padding:14px;">
      <div class="ct"><i class="ti ti-plus"></i> <span id="ACC_TITLE"></span></div>
      <div id="ACC_LIST"></div>
      <button class="ghostb" id="BTN_ADD_ACC" onclick="toggleExtraPicker('acc')"></button>
      <div id="PICKER_acc" style="display:none;margin-top:10px;">
        <div style="font-size:11px;color:var(--tx2);margin-bottom:6px;" id="LIB_TITLE_acc"></div>
        <div class="frow" id="CHIPS_acc" style="flex-wrap:wrap;overflow-x:visible;"></div>
        <div style="font-size:11px;color:var(--tx2);margin:10px 0 6px;" id="CUSTOM_TITLE_acc"></div>
        <div class="prow">
          <input class="pinp" id="CUSTOM_NAME_acc" type="text">
          <button class="gbtn" style="width:auto;margin-top:0;padding:0 16px;" id="BTN_CUSTOM_acc" onclick="addCustomExtra('acc')"></button>
        </div>
        <button class="ghostb" id="BTN_CLOSE_acc" onclick="toggleExtraPicker('acc')"></button>
      </div>
    </div>
    <button class="gbtn" id="BTN_SAVEDAY" onclick="saveTodayToGraph()"></button>
    <button class="ghostb" id="BTN_TIMER" onclick="toggleTimer()" style="margin-top:10px;"></button>
    <div class="tsec" id="TIMER_SEC" style="display:none;">
      <div class="rwrap">
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="var(--sf)" stroke-width="8"/>
          <circle id="RING" cx="50" cy="50" r="42" fill="none" stroke="#1D9E75" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="0"/>
        </svg>
        <div class="rcenter" id="T_DISP">2:00</div>
      </div>
      <div style="font-size:12px;color:var(--tx2);margin-bottom:12px;" id="T_NEXT"></div>
      <div class="tpre">
        <button class="pbtn" onclick="setTV(90)">1:30</button>
        <button class="pbtn" onclick="setTV(150)">2:30</button>
        <button class="pbtn" onclick="setTV(210)">3:30</button>
        <button class="pbtn" onclick="setTV(240)">4min</button>
      </div>
      <div class="tadj">
        <button class="adjb" onclick="adjT(-15)">&#8722;</button>
        <span style="font-size:12px;color:var(--tx2);" id="T_ADJ"></span>
        <button class="adjb" onclick="adjT(15)">+</button>
      </div>
      <div class="tbts">
        <button class="tbtn p" id="T_BTN" onclick="toggleT()"></button>
        <button class="tbtn" id="T_CLOSE" onclick="closeTimer()"></button>
      </div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="screen" id="screen-cal">
    <div class="card">
      <div class="chdr">
        <button class="cnav" onclick="calMv(-1)">&#8249;</button>
        <div class="cmon" id="CAL_MON"></div>
        <button class="cnav" onclick="calMv(1)">&#8250;</button>
      </div>
      <div class="cgrid" id="CAL_DOW"></div>
      <div class="cgrid" id="CAL_DAYS"></div>
      <div id="CAL_LEGEND" style="font-size:10px;color:var(--tx2);margin-top:10px;line-height:1.6;"></div>
    </div>
    <div class="cdet" id="CAL_DET" style="display:none;"></div>
  </div>

  <!-- GRAPH -->
  <div class="screen" id="screen-graph">
    <div id="PR_SUMMARY"></div>
    <div class="frow" id="G_FILTERS"></div>
    <div class="card" style="padding:14px 10px;">
      <div style="position:relative;width:100%;height:220px;">
        <canvas id="G_CHART" role="img" aria-label="weight progress chart"></canvas>
      </div>
      <div style="font-size:10px;color:var(--tx3);margin-top:8px;line-height:1.5;" id="G_NOTE"></div>
    </div>
    <div class="card">
      <div class="ct"><i class="ti ti-plus"></i> <span id="G_ADD"></span></div>
      <div class="prow"><span class="plbl" id="G_EX_L"></span>
        <select class="pinp" id="LOG_EX"></select>
      </div>
      <div class="prow"><span class="plbl" id="G_WT_L"></span>
        <input class="pinp" id="LOG_WT" type="number" placeholder="85" step="0.5">
        <span class="punit">kg</span>
      </div>
      <div class="prow"><span class="plbl" id="G_DT_L"></span>
        <input class="pinp" id="LOG_DT" type="date">
      </div>
      <button class="gbtn" id="BTN_LOG" onclick="addLog()"></button>
    </div>
    <div class="card">
      <div class="ct"><i class="ti ti-history"></i> <span id="G_HIST"></span></div>
      <div id="HIST_LIST"></div>
    </div>
  </div>

  <!-- TIPS -->
  <div class="screen" id="screen-tips">
    <div id="TIPS_LIST"></div>
  </div>

  <!-- PROGRAM -->
  <div class="screen" id="screen-program">
    <div class="wtabs" id="WEEK_TABS"></div>
    <div class="pnote" id="PROG_NOTE"></div>
    <div id="PROG_LIST"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-pr">
    <div class="card">
      <div class="ct"><i class="ti ti-language"></i> <span id="S_LANG"></span></div>
      <div class="ltog">

// ===== STATE =====
function lget(k,d){try{var v=localStorage.getItem('wl2_'+k);return v!=null?JSON.parse(v):d;}catch(e){return d;}}
function lset(k,v){try{localStorage.setItem('wl2_'+k,JSON.stringify(v));}catch(e){}}

// dweek: { 'YYYY-MM-DD': weekIdx } - which program week a given date was trained under.
// Stamped once, on the first time anything is recorded for that date, and never overwritten,
// so editing an old session later can't rewrite its history.
var dweek=lget('dweek',{});
var curWeek=Math.min(lget('week',0),11);
// Auto week advance (opt-in): cycleStart is the date Week 1 began. The date-derived week is only
// ever a *suggestion* shown as a banner - the user confirms, or postpones a week they had to miss.
// Training progress follows what you actually did, not the calendar, so nothing advances silently.
var autoWeek=lget('autoWeek',false);
var cycleStart=lget('cycleStart',null);
var wDows=lget('dows',[1,2,4,5]);
var lang=lget('lang','ko');
var roundUnit=lget('roundUnit',2.5);
// volume tier: scales SET COUNT only (intensity % and reps/set stay coach/Prilepin-matched)
var volTier=lget('volTier','semipro');
var VOL_TIER_MULT={hobby:0.7,semipro:1.0,national:1.35};
// body metrics for level analysis
var bodyMetrics=lget('body',{bw:null,ht:null,sex:'m'});
// Level bands by Sinclair score (bodyweight-normalized total): [minSinclair, levelKey, recommendedTier] (high -> low).
// Male breakpoints follow publicly-cited Sinclair benchmark guides (Local 300 / Regional 350 / National 400 / International 450+).
// Female breakpoints are an approximation (~65% of male values, per general reporting that female Sinclair benchmarks
// run roughly 60-70% of male ones) since no equivalent official female-specific benchmark table was verified.
// This replaces an earlier body-weight-ratio heuristic that had no cited source at all.
var LEVEL_STD={
 m:[[450,'national','national'],[375,'semipro','semipro'],[300,'inter','semipro'],[250,'novice','hobby'],[0,'entry','hobby']],
 f:[[293,'national','national'],[244,'semipro','semipro'],[195,'inter','semipro'],[163,'novice','hobby'],[0,'entry','hobby']]
};

var curDay=(function(){var a=detectTodayDayIdx();return a!==null?a:lget('day',0);}());

// ===== HELPERS =====
function L(){return LNG[lang];}
function W(){return WEEKS[curWeek];}
function getPR(k){return prs[k]||DEFAULTS[k]||80;}
function roundW(w){return Math.round((Math.round(w/roundUnit)*roundUnit)*100)/100;}
function exName(ex){return lang==='ko'?ex.nk:ex.ne;}
function exNote(ex){return lang==='ko'?ex.noK:ex.noE;}
function repsCount(r){return String(r).split('+').reduce(function(a,b){return a+(parseInt(b)||0);},0);}
function calcW(ex){return roundW(getPR(ex.base)*ex.pct);}
function ladderStr(ex){
  var pr=getPR(ex.base);
  return roundW(pr*0.90)+' → '+roundW(pr*0.95)+' → '+pr+'kg+';
}
function toast(m){var t=document.getElementById('TOAST');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function dStr(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function todayStr(){var n=new Date();return dStr(n.getFullYear(),n.getMonth(),n.getDate());}
function setKey(ds,di,ei,si){return ds+'-'+di+'-'+ei+'-'+si;}
function dateWorkoutDay(date){var d=date.getDay();var i=wDows.indexOf(d);return i===-1?null:i;}
function hasLog(ds){return Object.keys(setStates).some(function(k){return k.indexOf(ds)===0&&(setStates[k]==='d'||setStates[k]==='f');});}
function isPRWeek(){return curWeek===10;}
function stampWeek(ds){if(dweek[ds]==null){dweek[ds]=curWeek;lset('dweek',dweek);}}
function weekOf(ds){return dweek[ds]!=null?dweek[ds]:null;}
function extraScope(){return todayStr()+'-D'+curDay;}
function getExtras(scope){return lget('extra_'+scope,[]);}
function setExtras(scope,arr){lset('extra_'+scope,arr);}
function extraSetKey(scope,uid,si){return scope+'-X'+uid+'-'+si;}
function slugify(s){return 'c_'+s.toLowerCase().replace(/[^a-z0-9가-힣]+/g,'_').replace(/^_+|_+$/g,'').slice(0,30)||'c_ex';}

// ===== PER-DAY EXERCISE ADJUSTMENTS (weight +/-roundUnit, sets +/-1, reps +/-1) =====
function adjStore(ds){return lget('madj_'+ds,{});}
function getAdj(ds,di,ei){var a=adjStore(ds);return a[di+'-'+ei]||{};}
function saveAdj(ds,di,ei,obj){
  var a=adjStore(ds);
  if(!obj.w&&!obj.s&&!obj.r)delete a[di+'-'+ei];
  else a[di+'-'+ei]=obj;
  lset('madj_'+ds,a);
}
function repsIsNumeric(r){return String(r).indexOf('+')===-1;}
function effW(ex,adj){return Math.max(20,roundW(getPR(ex.base)*ex.pct)+(adj.w||0));}
function baseSets(ex){return Math.max(1,Math.min(12,Math.round(ex.sets*(VOL_TIER_MULT[volTier]||1))));}
function effSets(ex,adj){return Math.max(1,Math.min(12,baseSets(ex)+(adj.s||0)));}
function effReps(ex,adj){
  if(!repsIsNumeric(ex.reps))return ex.reps;
  return String(Math.max(1,Math.min(30,(parseInt(ex.reps)||1)+(adj.r||0))));
}
function bumpAdj(di,ei,field,delta){
  var ds=todayStr();
  var ex=W().days[di].ex[ei];
  var adj=getAdj(ds,di,ei);
  if(field==='w'){adj.w=(adj.w||0)+delta*roundUnit;if(roundW(getPR(ex.base)*ex.pct)+adj.w<20)adj.w=20-roundW(getPR(ex.base)*ex.pct);if(Math.abs(adj.w)<0.001)adj.w=0;}
  if(field==='s'){var base=baseSets(ex);var ns=base+(adj.s||0)+delta;if(ns<1||ns>12)return;adj.s=(adj.s||0)+delta;

  if(field==='r'){if(!repsIsNumeric(ex.reps))return;var nr=(parseInt(ex.reps)||1)+(adj.r||0)+delta;if(nr<1||nr>30)return;adj.r=(adj.r||0)+delta;}

function sinclairTotal(total,bw,sex){
  if(!bw||bw<=0)return null;
  var A=sex==='f'?0.783497476:0.751945030;
  var b=sex==='f'?153.655:175.508;
  var coef=bw>=b?1:Math.pow(10,A*Math.pow(Math.log(bw/b)/Math.LN10,2));
  return Math.round(total*coef*10)/10;
}
function classifyLevel(){
  var bw=bodyMetrics.bw;
  if(!bw||bw<=0)return null;
  var cj=getPR('cleanjerk'),sn=getPR('snatch');
  var sin=sinclairTotal(sn+cj,bw,bodyMetrics.sex);
  var std=LEVEL_STD[bodyMetrics.sex==='f'?'f':'m'];
  var lvl=std[std.length-1];
  for(var i=0;i<std.length;i++){if(sin>=std[i][0]){lvl=std[i];break;}}
  var bmi=bodyMetrics.ht?Math.round(bw/Math.pow(bodyMetrics.ht/100,2)*10)/10:null;
  return{levelKey:lvl[1],tier:lvl[2],cjR:Math.round(cj/bw*100)/100,snR:Math.round(sn/bw*100)/100,bmi:bmi,sinclair:sin};
}

function parseDate(s){return new Date(s+'T00:00:00');}
function shiftDateStr(s,days){var t=parseDate(s);t.setDate(t.getDate()+days);return dStr(t.getFullYear(),t.getMonth(),t.getDate());}
function computedWeek(){
  if(!cycleStart)return null;
  var d=Math.floor((parseDate(todayStr())-parseDate(cycleStart))/86400000);
  if(d<0)return 0;
  return Math.max(0,Math.min(11,Math.floor(d/7)));
}
// re-anchor so that the given week index is "this week" by the calendar
function reanchorCycle(wk){cycleStart=shiftDateStr(todayStr(),-wk*7);lset('cycleStart',cycleStart);}

// ===== PRILEPIN VOLUME =====
// zones: [pctLow, pctHigh, minReps, optimalReps, maxReps] — contiguous, half-open [low,high)
// Source: A.S. Prilepin's chart (55-65%:24[18-30], 70-80%:18[12-24], 80-90%:15[10-20], 90%+:7[4-10]).
// Boundaries nudged by 0.5%pt to close the ambiguous 65-70%/75-80% gaps between cited versions of the table.
// No official data exists below ~55%, so intensities under that are intentionally left unclassified (no fabricated zone).
var PRILEPIN=[[0.545,0.695,18,24,30],[0.695,0.795,12,18,24],[0.795,0.895,10,15,20],[0.895,3,4,7,10]];
function getPrilepinZone(p){for(var i=0;i<PRILEPIN.length;i++){if(p>=PRILEPIN[i][0]&&p<PRILEPIN[i][1])return PRILEPIN[i];}return null;}
function calcDayVolume(){
  var ds=todayStr();
  var totalKg=0,mainKg=0,extraKg=0,snatchKg=0,cjKg=0,pReps=0,pMin=0,pMax=0,pExtraReps=0;
  W().days[curDay].ex.forEach(function(ex,ei){
    if(ex.acc||ex.ladder)return;
    var adj=getAdj(ds,curDay,ei);
    var w=effW(ex,adj),reps=repsCount(effReps(ex,adj)),sets=effSets(ex,adj),vol=w*reps*sets;
    totalKg+=vol;mainKg+=vol;
    if(ex.base==='snatch')snatchKg+=vol;
    if(ex.base==='cleanjerk')cjKg+=vol;
    if((ex.base==='snatch'||ex.base==='cleanjerk')){
      var z=getPrilepinZone(w/getPR(ex.base));
      if(z){pReps+=reps*sets;pMin+=z[2];pMax+=z[4];}
    }
  });
  // extras (warm-up + accessories): all weighted work counts toward daily total
  getExtras(extraScope()).forEach(function(ex){
    if(ex.weight==null||isNaN(ex.weight)||ex.weight<=0)return;
    var vol=ex.weight*(ex.reps||1)*ex.sets;
    totalKg+=vol;extraKg+=vol;
    if(ex.pril==='snatch')snatchKg+=vol;
    if(ex.pril==='cleanjerk')cjKg+=vol;
    if(ex.pril){
      var z=getPrilepinZone(ex.weight/getPR(ex.pril));
      if(z){pReps+=(ex.reps||1)*ex.sets;pExtraReps+=(ex.reps||1)*ex.sets;pMin+=z[2];pMax+=z[4];}
    }
  });
  return{totalKg:Math.round(totalKg),mainKg:Math.round(mainKg),extraKg:Math.round(extraKg),snatchKg:Math.round(snatchKg),cjKg:Math.round(cjKg),pReps:pReps,pMin:pMin,pMax:pMax,pExtraReps:pExtraReps};
}

  var stBg=!hasZone?'rgba(153,153,153,.12)':low?'rgba(226,75,74,.12)':high?'rgba(186,117,23,.12)':'rgba(29,158,117,.12)';

function removeExtra(uid){

  setExtras(scope,extras);
  Object.keys(setStates).forEach(function(k){if(k.indexOf(scope+'-X'+uid+'-')===0)delete setStates[k];});
  lset('sets',setStates);

function setExtraWeight(uid,val){
  var scope=extraScope();
  var extras=getExtras(scope);
  var w=parseFloat(val);
  extras.forEach(function(x){if(x.uid===uid)x.weight=isNaN(w)?null:w;});
  setExtras(scope,extras);
  renderVolumeBanner();
}
function adjExtraField(uid,field,delta){
  var scope=extraScope();
  var extras=getExtras(scope);
  extras.forEach(function(x){
    if(x.uid!==uid)return;
    if(field==='sets'){
      var oldS=x.sets;
      x.sets=Math.max(1,Math.min(8,x.sets+delta));
      if(x.sets<oldS){for(var s=x.sets;s<oldS;s++){delete setStates[extraSetKey(scope,uid,s)];}lset('sets',setStates);}
    }else{
      x.reps=Math.max(1,Math.min(60,(x.reps||1)+delta));
    }
  });
  setExtras(scope,extras);
  renderExtras();renderVolumeBanner();
}
function tapExtraSet(uid,si){
  stampWeek(todayStr());
  var scope=extraScope();
  var k=extraSetKey(scope,uid,si);
  var c=setStates[k]||'p';
  setStates[k]=c==='p'?'d':c==='d'?'f':'p';
  lset('sets',setStates);
  renderExtras();
  if(setStates[k]==='d')openTimer(90);
}

// ===== SAVE SESSION TO GRAPH =====
function saveTodayToGraph(){
  var ds=todayStr(),dd=W().days[curDay],saved=0;
  stampWeek(ds);
  dd.ex.forEach(function(ex,ei){
    if(!ex.log||ex.ladder)return;
    var adj=getAdj(ds,curDay,ei);
    var doneCnt=0,nSets=effSets(ex,adj);
    for(var s=0;s<nSets;s++){if(setStates[setKey(ds,curDay,ei,s)]==='d')doneCnt++;}
    if(doneCnt===0)return;
    var wgt=effW(ex,adj);
    var found=null;
    for(var i=0;i<logs.length;i++){if(logs[i].auto&&logs[i].ex===ex.log&&logs[i].date===ds){found=logs[i];break;}}
    if(found){found.weight=Math.max(found.weight,wgt);}
    else logs.push({ex:ex.log,weight:wgt,date:ds,auto:true});
    saved++;
  });
  var extras=getExtras(extraScope());
  extras.forEach(function(ex){
    var doneCnt=0;
    for(var s=0;s<ex.sets;s++){if(setStates[extraSetKey(extraScope(),ex.uid,s)]==='d')doneCnt++;}
    if(doneCnt===0)return;
    if(ex.weight==null||isNaN(ex.weight)||ex.weight<=0)return;
    var key=slugify(ex.nameKo);
    var found=null;
    for(var i=0;i<logs.length;i++){if(logs[i].auto&&logs[i].ex===key&&logs[i].date===ds){found=logs[i];break;}}
    if(found){found.weight=Math.max(found.weight,ex.weight);found.labelKo=ex.nameKo;found.labelEn=ex.nameEn;}
    else logs.push({ex:key,weight:ex.weight,date:ds,auto:true,labelKo:ex.nameKo,labelEn:ex.nameEn});
    saved++;
  });
  if(saved===0){toast(L().savedNone);return;}
  lset('logs',logs);
  var v=calcDayVolume();
  var pMsg='';
  if(v.pMax>0){
    var st=v.pReps<v.pMin?(lang==='ko'?'부족':'Low'):v.pReps>v.pMax?(lang==='ko'?'과잉':'High'):(lang==='ko'?'적정':'OK');
    pMsg=' · Prilepin '+v.pReps+'/'+v.pMin+'~'+v.pMax+' ('+st+(v.pExtraReps>0?(lang==='ko'?', 보조 +'+v.pExtraReps:', +'+v.pExtraReps+' extra'):'')+')';
  }
  toast(saved+' '+L().savedDay+pMsg);
  renderVolumeBanner();
  if(document.getElementById('screen-graph').classList.contains('active'))renderGraph();
}

function openTimer(s){tTotal=s;tLeft=s;tRun=false;clearInterval(tInt);updTDisp();document.getElementById('TIMER_SEC').style.display='block';tOpen=true;document.getElementById('T_BTN').textContent=L().tStart;document.getElementById('TIMER_SEC').scrollIntoView({behavior:'smooth',block:'nearest'});}
function toggleTimer(){if(!tOpen)openTimer(150);else closeTimer();}
function closeTimer(){clearInterval(tInt);tRun=false;document.getElementById('TIMER_SEC').style.display='none';tOpen=false;}
function setTV(s){tTotal=s;tLeft=s;clearInterval(tInt);tRun=false;document.getElementById('T_BTN').textContent=L().tStart;updTDisp();}
function adjT(s){tLeft=Math.max(5,tLeft+s);tTotal=Math.max(tTotal,tLeft);updTDisp();}
function resetT(){tLeft=tTotal;clearInterval(tInt);tRun=false;document.getElementById('T_BTN').textContent=L().tStart;updTDisp();}
function toggleT(){
  if(tRun){clearInterval(tInt);tRun=false;document.getElementById('T_BTN').textContent=L().tStart;}
  else{
    if(tLeft<=0){resetT();return;}
    tRun=true;document.getElementById('T_BTN').textContent=L().tPause;
    tInt=setInterval(function(){
      tLeft--;
      if(tLeft<=0){tLeft=0;clearInterval(tInt);tRun=false;document.getElementById('T_BTN').textContent=L().tStart;}
      updTDisp();
    },1000);
  }
}
function updTDisp(){
  var m=Math.floor(tLeft/60),s=tLeft%60;
  document.getElementById('T_DISP').textContent=m+':'+(s<10?'0':'')+s;
  var c=263.9,o=c-(c*(tLeft/Math.max(tTotal,1)));
  document.getElementById('RING').style.strokeDashoffset=o;
}

    }).join('');
    var dow=wDows[di];
    d.innerHTML='<div class="pdtitle">Day '+(di+1)+(dow!=null?' ('+l.dowNames[dow]+')':'')+' — '+(lang==='ko'?dd.sk:dd.se)+'</div>'+rows;
    list.appendChild(d);
  });
}
function selWeek(i){setWeek(i);}

// ===== TIPS =====
function renderTips(){
  var list=document.getElementById('TIPS_LIST');list.innerHTML='';
  TIPS.forEach(function(sec){
    var card=document.createElement('div');card.className='tipsec';
    var items=sec.items.map(function(it){
      var idAttr=it.id?' id="tip-'+it.id+'"':'';
      return '<div class="tipitem"'+idAttr+'><div class="tiptitle">'+(lang==='ko'?it.tk:it.te)+'</div><div class="tipdesc">'+(lang==='ko'?it.dk:it.de)+'</div></div>';
    }).join('');
    card.innerHTML='<div class="ct"><i class="ti '+sec.icon+'"></i> '+(lang==='ko'?sec.tk:sec.te)+'</div>'+items;
    list.appendChild(card);
  });
}
function goTip(t){
  sw('tips');
  setTimeout(function(){
    var el=document.getElementById('tip-'+t);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('tiphl');
      setTimeout(function(){el.classList.remove('tiphl');},2200);
    }
  },80);
}

// ===== GRAPH =====
function renderGFilters(){
  document.getElementById('G_FILTERS').innerHTML=L().gFilters.map(function(f){
    return '<button class="fbtn'+(f.k===curFilter?' active':'')+'" onclick="setFilt(\''+f.k+'\')">'+f.l+'</button>';
  }).join('');
}
function setFilt(k){curFilter=k;renderGFilters();renderGraph();}
function renderPRSummary(){
  var l=L();
  var el=document.getElementById('PR_SUMMARY');
  var today=new Date();
  var rows=['snatch','cleanjerk'].map(function(k){
    var liftLogs=logs.filter(function(x){return x.ex===k;}).sort(function(a,b){return a.date>b.date?1:-1;});
    var last=liftLogs.length?liftLogs[liftLogs.length-1]:null;
    var ago=last?Math.floor((today-new Date(last.date+'T00:00:00'))/86400000):null;
    var agoTxt=last?(lang==='ko'?ago+'일 전 '+last.weight+'kg':ago+'d ago '+last.weight+'kg'):(lang==='ko'?'기록 없음':'no record');
    return '<div style="flex:1;background:var(--sf);border-radius:8px;padding:10px;text-align:center;">'+
      '<div style="font-size:11px;color:var(--tx2);margin-bottom:3px;">'+l.exNames[k]+'</div>'+
      '<div style="font-size:20px;font-weight:700;color:'+(k==='snatch'?'var(--g)':'var(--b)')+';">'+getPR(k)+'<span style="font-size:11px;color:var(--tx2);font-weight:400;"> kg</span></div>'+
      '<div style="font-size:10px;color:var(--tx3);margin-top:2px;">'+agoTxt+'</div></div>';
  }).join('');
  el.innerHTML='<div class="card" style="padding:12px;"><div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:10px;"><i class="ti ti-trophy" style="color:var(--g)"></i> '+(lang==='ko'?'현재 PR 현황':'Current PR status')+'</div><div style="display:flex;gap:8px;">'+rows+'</div></div>';
}
function exLabel(x){
  var l=L();
  if(x.labelKo)return lang==='ko'?x.labelKo:(x.labelEn||x.labelKo);
  return l.exNames[x.ex]||x.ex;
}
function renderGraph(){
  var l=L();
  renderPRSummary();
  var filtered=curFilter==='all'?logs:logs.filter(function(x){return x.ex===curFilter;});
  var hist=document.getElementById('HIST_LIST');
  if(!filtered.length){hist.innerHTML='<div style="font-size:13px;color:var(--tx2);">'+l.noRec+'</div>';}
  else{
    hist.innerHTML=filtered.slice().reverse().slice(0,40).map(function(x){
      var idx=logs.indexOf(x);
      var tag=x.auto?'<span class="htag">'+l.trainTag+'</span>':(x.weight>=getPR(x.ex)?'<span class="htag pr">'+l.prTag+'</span>':'');
      return '<div class="hrow"><div><div class="hex">'+exLabel(x)+' '+tag+'</div><div class="hdate">'+x.date+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:10px;"><span class="hwt">'+x.weight+'kg</span>'+
        '<button class="delbtn" onclick="delLog('+idx+')"><i class="ti ti-trash"></i></button></div></div>';
    }).join('');
  }
  var canvas=document.getElementById('G_CHART');
  if(chartInst){chartInst.destroy();chartInst=null;}
  var allDates=logs.map(function(x){return x.date;}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
  if(!allDates.length)return;
  var presentKeys=logs.map(function(x){return x.ex;}).filter(function(v,i,a){return a.indexOf(v)===i;});
  var keys=curFilter==='all'?presentKeys:[curFilter];
  var datasets=keys.map(function(k){
    var data=logs.filter(function(x){return x.ex===k;}).sort(function(a,b){return a.date>b.date?1:-1;});
    if(!data.length)return null;
    var c=colorFor(k);
    return{label:exLabel(data[data.length-1]),data:data.map(function(x){return{x:x.date,y:x.weight};}),
      borderColor:c,backgroundColor:c,borderWidth:2,
      pointRadius:data.map(function(x){return x.auto?3:5;}),
      pointStyle:data.map(function(x){return x.auto?'circle':'rectRot';}),
      tension:0.3,fill:false};
  }).filter(Boolean);
  chartInst=new Chart(canvas,{type:'line',data:{labels:allDates,datasets:datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:datasets.length>1,position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8,color:'#888'}}},
      scales:{x:{ticks:{font:{size:10},color:'#888',maxTicksLimit:5,maxRotation:45},grid:{color:'rgba(128,128,128,0.1)'}},
        y:{ticks:{font:{size:10},color:'#888',callback:function(v){return v+'kg';}},grid:{color:'rgba(128,128,128,0.1)'}}}}});
}
function addLog(){
  var l=L();
  var ex=document.getElementById('LOG_EX').value;
  var w=parseFloat(document.getElementById('LOG_WT').value);
  var d=document.getElementById('LOG_DT').value;
  if(!ex||isNaN(w)||!d){toast(lang==='ko'?'입력 확인':'Check input');return;}
  logs.push({ex:ex,weight:Math.round(w*10)/10,date:d});lset('logs',logs);
  document.getElementById('LOG_WT').value='';
  if(w>(prs[ex]||DEFAULTS[ex]||0)){prs[ex]=w;lset('prs',prs);toast(l.newPR+' '+(l.exNames[ex]||ex)+' '+w+'kg');}
  else toast(l.logAdded);
  renderGraph();
}
function delLog(idx){if(idx<0||idx>=logs.length)return;logs.splice(idx,1);lset('logs',logs);renderGraph();}

// ===== DATA =====
function collectPrefixedForExport(prefix){
  var out={};
  try{
    Object.keys(localStorage).forEach(function(k){
      if(k.indexOf('wl2_'+prefix)===0){
        var key=k.slice(('wl2_'+prefix).length);
        try{out[key]=JSON.parse(localStorage.getItem(k));}catch(e){}
      }
    });
  }catch(e){}
  return out;
}
function exportData(){
  var data={prs:prs,logs:logs,curWeek:curWeek,setStates:setStates,wDows:wDows,lang:lang,roundUnit:roundUnit,volTier:volTier,body:bodyMetrics,autoWeek:autoWeek,cycleStart:cycleStart,dweek:dweek,extras:collectPrefixedForExport('extra_'),madj:collectPrefixedForExport('madj_'),date:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='weightlifting_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast(L().exported);
}
function importData(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(d.prs)prs=d.prs;if(d.logs)logs=d.logs;
      if(d.curWeek!=null)curWeek=Math.min(d.curWeek,11);
      if(d.setStates)setStates=d.setStates;if(d.wDows)wDows=d.wDows;
      if(d.lang)lang=d.lang;if(d.roundUnit)roundUnit=d.roundUnit;
      if(d.volTier&&VOL_TIER_MULT[d.volTier])volTier=d.volTier;
      if(d.body)bodyMetrics=Object.assign({bw:null,ht:null,sex:'m'},d.body);
      if(d.autoWeek!=null)autoWeek=!!d.autoWeek;
      if(d.cycleStart)cycleStart=d.cycleStart;
      if(d.dweek)dweek=d.dweek;
      lset('prs',prs);lset('logs',logs);lset('week',curWeek);lset('sets',setStates);lset('dows',wDows);lset('lang',lang);lset('roundUnit',roundUnit);lset('volTier',volTier);lset('body',bodyMetrics);lset('autoWeek',autoWeek);lset('cycleStart',cycleStart);lset('dweek',dweek);
      if(d.extras){Object.keys(d.extras).forEach(function(dateKey){setExtras(dateKey,d.extras[dateKey]);});}
      if(d.madj){Object.keys(d.madj).forEach(function(dateKey){lset('madj_'+dateKey,d.madj[dateKey]);});}
      applyLang();renderHeader();renderToday();renderPRInputs();
      toast(L().imported);
    }catch(err){toast(L().importErr);}
  };
  r.readAsText(file);
}

// ===== SCREEN SWITCH =====
function sw(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.ni').forEach(function(b){b.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='today'){var a=detectTodayDayIdx();if(a!==null)curDay=a;renderToday();}
  if(name==='program')renderProgram();
  if(name==='pr')renderPRInputs();
  if(name==='cal')renderCal();
  if(name==='tips')renderTips();
  if(name==='graph'){
    if(!document.getElementById('LOG_DT').value)document.getElementById('LOG_DT').value=new Date().toISOString().slice(0,10);
    renderGFilters();renderGraph();
  }
}

// ===== INIT =====
// one-time migration: legacy extras were keyed by date only (extra_YYYY-MM-DD),
// which made them appear on every training day. Move each into that date's Day 1 scope.
(function migrateExtras(){
  if(lget('extraMig1',false))return;
  try{
    Object.keys(localStorage).slice().forEach(function(k){
      var m=k.match(/^wl2_extra_(\d{4}-\d{2}-\d{2})$/);
      if(!m)return;
      var dateKey=m[1];
      var val=lget('extra_'+dateKey,null);
      if(val&&val.length){
        var target='extra_'+dateKey+'-D0';
        var existing=lget(target,[]);
        lset(target,existing.concat(val));
        var sets=lget('sets',{}),changed=false;
        Object.keys(sets).forEach(function(sk){
          var pfx=dateKey+'-X';
          if(sk.indexOf(pfx)===0){sets[dateKey+'-D0-X'+sk.slice(pfx.length)]=sets[sk];delete sets[sk];changed=true;}
        });
        if(changed){setStates=sets;lset('sets',sets);}
      }
      try{localStorage.removeItem(k);}catch(e){}
    });
  }catch(e){}
  lset('extraMig1',true);
})();
applyLang();
renderHeader();
renderToday();
</script>
